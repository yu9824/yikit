target-version = "py38"
line-length = 79
indent-width = 4
extend-exclude = ["examples", "docs_src"]
force-exclude = true

[lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "FA"]
unfixable = ["F401"]

[lint.isort]
required-imports = ["from __future__ import annotations"]

[lint.pydocstyle]
convention = "numpy"
