# https://packaging.python.org/ja/latest/guides/writing-pyproject-toml/
[build-system]
requires = ["setuptools>=77.0.3", "setuptools-scm>=10.1"]
build-backend = "setuptools.build_meta"

[project]
name = "yikit"
dynamic = ["version"]
dependencies = [
    "scikit-learn>=1.0",
    "numpy",
    "pandas",
    "joblib",
    "scipy",
    "matplotlib",
    "seaborn>=0.12",
]
requires-python = ">=3.10"
authors = [{ name = "yu9824" }]
maintainers = [{ name = "yu9824" }]
description = "This is my own toolkit."
readme = { file = "README.md", content-type = "text/markdown" }
# https://spdx.org/licenses/
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]
keywords = [
    "machine learning",
    "regression",
    "feature selection",
    "visualization",
    "metrics",
]
# https://pypi.org/classifiers/
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = ["pytest"]
dev = ["build", "jupytext", "ruff", "mypy"]
optional = [
    "colorlog",
    "tqdm",
    # <0.5.11: 0.5.11 changes set_params/get_params of nested names; see tech.md.
    "ngboost>=0.4,<0.5.11",
    "lightgbm>=4.0",
    "Boruta>=0.4.3",
    "optuna>=3.2",
    "optuna-integration>=4.1",
]
docs = [
    "sphinx",
    "myst-parser",
    "myst-nb",
    "sphinx-book-theme",
    "jupyter-sphinx",
]
# gui = ["TkEasyGUI"]

[project.urls]
Homepage = "https://github.com/yu9824/yikit"
Documentation = "https://yu9824.github.io/yikit/"
PyPI = "https://pypi.org/project/yikit/"
Source = "https://github.com/yu9824/yikit"
Tracker = "https://github.com/yu9824/yikit/issues"
"Release Notes" = "https://github.com/yu9824/yikit/releases"
# Changelog = "https://github.com/yu9824/yikit/blob/main/CHANGELOG.md"

# [project.scripts]
# yikit = "yikit.__main__:entrypoint"

# [project.gui-scripts]
# yikit-gui = "yikit:main_gui"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src/"]

[tool.setuptools_scm]
version_file = "src/yikit/_version.py"
write_to_source = true

[tool.pytest.ini_options]
testpaths = ["tests"]
