# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "pip" # See documentation for possible values
    directory: "/" # Location of package manifests
    # Keep the declared ranges; only widen them when a new release falls outside.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore: "
    open-pull-requests-limit: 5
    ignore:
      # ngboost 0.5.11 passes nested names in set_params/get_params, which
      # yikit does not support yet. drop-legacy-compat caps ngboost<0.5.11
      # (author's decision, 2026-10-14); remove this entry when yikit
      # supports it.
      - dependency-name: "ngboost"
        versions: [">=0.5.11"]

  # GitHub Actions ("/" makes Dependabot look in .github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore: "
    open-pull-requests-limit: 5
    # Actions rarely break when bumped together, so group them into one PR.
    groups:
      github-actions:
        patterns:
          - "*"
