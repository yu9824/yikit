name: docs
run-name: ${{ github.workflow }} (${{ github.ref_name }})

on:
  workflow_dispatch:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    # runs-on: ubuntu-22.04
    steps:
      # Same depth as the release build job. Tag refs (push or manual): fetch
      # only that tag (depth 1), so the docs get its version even if an rc tag
      # points to the same commit. Do not ask checkout to fetch tags: it then
      # fetches all tags even in a shallow clone. Other refs (manual runs on a
      # branch): fetch all history and tags (depth 0) to get a dev version.
      # Keep `&& 1 || 0` in this order: 0 is falsy, so `&& 0 || 1` would
      # always give 1.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && 1 || 0 }}
      - uses: actions/setup-python@v7
      - name: Install dependencies
        run: |
          pip install ".[docs,optional]"
      - name: sphinx-apidoc
        run: |
          sphinx-apidoc -f -o ./docs_src ./src/yikit --module-first
      - name: Sphinx build
        run: |
          sphinx-build -b html ./docs_src ./docs
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
